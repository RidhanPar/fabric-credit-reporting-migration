name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q
      - name: Generate data and legacy workbook
        run: python -m portfolio_migration generate --out build
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-workbook-and-manifest
          path: |
            build/legacy/
            build/generation_manifest.json
