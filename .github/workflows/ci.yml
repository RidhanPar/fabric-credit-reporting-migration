name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: data generation, legacy workbook, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt && pip install -e .
      - name: Lint
        run: ruff check src tests scripts
      - name: Notebooks are up to date with the generator
        run: python scripts/build_fabric_notebooks.py && git diff --exit-code fabric/notebooks
      - name: Unit tests
        run: pytest -q
      - name: Generate data and legacy workbook
        run: python -m portfolio_migration generate --out build
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-workbook-and-manifest
          path: |
            build/legacy/
            build/generation_manifest.json

  spark:
    name: medallion on Spark 3.5 and Delta 3.2 (Fabric Runtime 1.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-spark.txt
      - run: pip install -r requirements-spark.txt && pip install -e .
      - name: Spark tests (silver rules and end to end medallion run)
        run: pytest -q tests/spark
      - name: Build the wheel for the Fabric Environment
        run: pip wheel . --no-deps -w dist
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-migration-wheel
          path: dist/*.whl
